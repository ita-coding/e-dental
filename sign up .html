<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Klinik Gigi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0e3e3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .signup-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .signup-card h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #333333;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #666666;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* Primary input style (Green highlight matching top field) */
    .input-green {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #00ff88;
      background-color: #00ff88;
      color: #ffffff;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .input-green::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    /* Secondary input style (Orange background matching other fields) */
    .input-orange {
      width: 100%;
      padding: 12px 14px;
      border: none;
      background-color: #d97706;
      color: #ffffff;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .input-orange::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    /* Radio button options for Gender */
    .radio-group {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #555555;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      accent-color: #00ff88;
      cursor: pointer;
    }

    /* Submit Button */
    .btn-submit {
      padding: 14px;
      background-color: #00ff88;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #00ff88;
    }
  </style>
</head>
<body>

  <div class="signup-card">
    <h2>SIGN UP</h2>
    
    <form action="profile info.html" method="GET">
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">FULL NAME</label>
        <input type="text" id="name" name="name" class="input-green" placeholder="Enter your full name"  required>
      </div>

      <!-- Gender Field -->
      <div class="form-group">
        <label for="gender">GENDER</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="gender" value="male" required> Male
          </label>
          <label class="radio-option">
            <input type="radio" name="gender" value="female"> Female
          </label>
        </div>
      </div>

      <!-- Age Field -->
      <div class="form-group">
        <label for="age">AGE</label>
        <input type="number" id="age" name="age" class="input-orange" placeholder="Enter your age"  required>
      </div>

      <!-- Address Field -->
      <div class="form-group">
        <label for="address">ADDRESS</label>
        <input type="text" id="address" name="address" class="input-orange" placeholder="Enter your address" required>
      </div>

      <!-- Submit Button -->
      <input type="submit" class="btn-submit" value="SIGN UP"></button>
    </form>
  </div>

</body>
</html>
